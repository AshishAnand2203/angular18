
<div class="toast-container-custom" aria-label="Notifications">

  @for (item of toast.toasts(); track item.id) {
    <div
      class="notification-toast shadow"
      [class.toast-success]="item.type === 'success'"
      [class.toast-error]="item.type === 'error'"
      [class.toast-warning]="item.type === 'warning'"
      [class.toast-info]="item.type === 'info'"
      [attr.role]="item.type === 'error' ? 'alert' : 'status'"
      [attr.aria-live]="item.type === 'error' ? 'assertive' : 'polite'"
      aria-atomic="true"
    >

      <div class="toast-symbol">
        <i class="bi" [class]="icon(item.type)" aria-hidden="true"></i>
      </div>

      <div class="toast-body-content">
        <div class="toast-heading">{{ item.title }}</div>
        <div class="toast-description">{{ item.message }}</div>
      </div>

      <button
        type="button"
        class="toast-close"
        [attr.aria-label]="'Dismiss ' + item.title + ' notification'"
        (click)="toast.dismiss(item.id)"
      >
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>

    </div>
  }

</div>
